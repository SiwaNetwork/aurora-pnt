# ═══════════════════════════════════════════════════════════════
# Блок E: 2D матрица altitude × sat_count
# Фиксировано: 75°, global grid 5°, 24h / 10min
# Высоты: 1000, 1200, 1400, 1600 км
# Кол-во спутн.: 90, 120, 180, 240, 300
# ═══════════════════════════════════════════════════════════════

experiment:
  name: "matrix_alt_count"
  base_config: "leopath/config/pnt/phase3_global.yaml"
  output_dir: "results/experiments/matrix_alt_count"
  sweep_parameter: "altitude_x_count"

