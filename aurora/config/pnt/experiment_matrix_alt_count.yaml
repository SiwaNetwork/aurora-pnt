    # ── 1000 км ───────────────────────────────────────────────
    - label: "a1000_n090"
      overrides:
        constellation.num_orbits: 9
        constellation.num_sats_per_orbit: 10
        constellation.inclination_degree: 75.0
        constellation.mean_motion_rev_per_day: 13.74
        satellite.altitude_m: 1000000
        pnt.grid: "global"
        pnt.grid_step_deg: 5.0
        simulation.end_time_hours: 24
        simulation.time_step_minutes: 10

