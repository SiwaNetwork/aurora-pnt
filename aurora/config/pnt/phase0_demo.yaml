# ═══════════════════════════════════════════════════════════════
# AURORA PNT — Фаза 0: Демонстратор технологии
# ═══════════════════════════════════════════════════════════════
# 3 спутника, 1 орбитальная плоскость
# Цель: проверить концепцию, измерить окна видимости над MCS
# Аналог: GPS Block I (4 спутника, 1978)

constellation:
  name: "AURORA-Phase0"
  num_orbits: 1
  num_sats_per_orbit: 3
  phase_diff: false
  inclination_degree: 87.0
  eccentricity: 0.0000001
  arg_of_perigee_degree: 0.0
  mean_motion_rev_per_day: 13.74   # ~1000 км

satellite:
  altitude_m: 1000000
  cone_angle_degrees: 10.0

earth:
  radius_m: 6378135.0
  isl_min_altitude_m: 80000

simulation:
  dynamic_state_algorithm: shortest_path_link_state
  end_time_hours: 24              # один полный день — видим все окна
  time_step_minutes: 1            # 1 мин — точная картина окон видимости
  offset_ns: 0

pnt:
  grid: "central_russia"
  grid_step_deg: 2.0
  min_elevation_deg: 10.0

# Только российские MCS
ground_stations:
  - name: "Vladimir"
    latitude: 56.1294
    longitude: 40.4067
    elevation_m: 177.0
  - name: "Zheleznogorsk"
    latitude: 56.2505
    longitude: 93.5319
    elevation_m: 305.0
  - name: "Khabarovsk"
    latitude: 48.4802
    longitude: 135.0719
    elevation_m: 68.0

network:
  gsl_interfaces:
    number_of_interfaces: 2
    aggregate_max_bandwidth: 1.0

logging:
  is_debug: false
  file_name: "aurora_phase0.log"
