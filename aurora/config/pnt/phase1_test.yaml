# ═══════════════════════════════════════════════════════════════
# AURORA PNT — Фаза 1: Тестовая система (покрытие России)
# ═══════════════════════════════════════════════════════════════
# 6 орбит × 8 спутников = 48 спутников
# Высота: 700 км, Наклонение: 87° (полярная, охват всей России)
# Наземные станции: Владимир, Железногорск, Хабаровск

constellation:
  name: "AURORA-Phase1"
  num_orbits: 6
  num_sats_per_orbit: 8
  phase_diff: true
  inclination_degree: 87.0
  eccentricity: 0.0000001
  arg_of_perigee_degree: 0.0
  mean_motion_rev_per_day: 14.76   # соответствует ~700 км

satellite:
  altitude_m: 700000
  cone_angle_degrees: 10.0         # маска возвышения для GSL

earth:
  radius_m: 6378135.0
  isl_min_altitude_m: 80000

simulation:
  dynamic_state_algorithm: shortest_path_link_state
  end_time_hours: 6                # для быстрого теста; 24 для полного прогона
  time_step_minutes: 5
  offset_ns: 0

# PNT-специфичные параметры
pnt:
  grid: "russia"                   # russia | eurasia | northern | global
  grid_step_deg: 5.0               # шаг сетки анализа покрытия
  min_elevation_deg: 10.0          # маска возвышения для PNT

# Станции управления группировкой (MCS)
ground_stations:
  - name: "Vladimir"
    latitude: 56.1294
    longitude: 40.4067
    elevation_m: 177.0

  - name: "Zheleznogorsk"
    latitude: 56.2505
    longitude: 93.5319
    elevation_m: 305.0

  - name: "Khabarovsk"
    latitude: 48.4802
    longitude: 135.0719
    elevation_m: 68.0

network:
  gsl_interfaces:
    number_of_interfaces: 4
    aggregate_max_bandwidth: 10.0

logging:
  is_debug: false
  file_name: "aurora_phase1.log"
