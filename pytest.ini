[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes
markers =
    slow: тесты длительностью > 5 с
    integration: тесты, запускающие full module pipeline
    smoke: быстрые smoke-тесты CLI
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:matplotlib
