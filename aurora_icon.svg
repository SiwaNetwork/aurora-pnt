<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <radialGradient id="earth" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#1a6fa8"/>
      <stop offset="55%" stop-color="#0a3d5e"/>
      <stop offset="100%" stop-color="#051525"/>
    </radialGradient>
    <radialGradient id="sat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00ffa3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="outer">
      <circle cx="64" cy="64" r="58"/>
    </clipPath>
  </defs>

  <!-- Outer badge circle -->
  <circle cx="64" cy="64" r="62" fill="#000d1a" opacity="0.6"/>
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>

  <!-- Aurora halo -->
  <circle cx="64" cy="64" r="56" fill="none"
          stroke="#00ffa3" stroke-width="6" opacity="0.06"/>

  <!-- Globe -->
  <circle cx="64" cy="64" r="36" fill="url(#earth)"/>

  <!-- Globe grid lines (subtle) -->
  <g clip-path="url(#outer)" opacity="0.18" stroke="#38d9f5" stroke-width="0.6" fill="none">
    <ellipse cx="64" cy="64" rx="36" ry="12"/>
    <ellipse cx="64" cy="64" rx="36" ry="24"/>
    <line x1="64" y1="28" x2="64" y2="100"/>
    <line x1="28" y1="64" x2="100" y2="64"/>
  </g>

  <!-- Globe rim -->
  <circle cx="64" cy="64" r="36" fill="none"
          stroke="#38d9f5" stroke-width="0.8" opacity="0.5"/>

  <!-- Main orbital ring (75° inclination — AURORA's orbit) -->
  <ellipse cx="64" cy="64" rx="54" ry="54"
           fill="none"
           stroke="#00ffa3" stroke-width="1.8"
           stroke-dasharray="none"
           opacity="0.0"
           transform="rotate(0 64 64)"/>

  <!-- The ring as a tilted ellipse (perspective of 75° inclined orbit) -->
  <ellipse cx="64" cy="64" rx="54" ry="20"
           fill="none"
           stroke="#00ffa3" stroke-width="1.6"
           opacity="0.75"
           transform="rotate(-40 64 64)"
           filter="url(#glow)"/>

  <!-- Second thinner ring (cross-plane) -->
  <ellipse cx="64" cy="64" rx="54" ry="20"
           fill="none"
           stroke="#a855f7" stroke-width="0.8"
           opacity="0.45"
           stroke-dasharray="5 4"
           transform="rotate(30 64 64)"
           filter="url(#glow)"/>

  <!-- Satellite on main orbit (top position) -->
  <g filter="url(#softglow)">
    <!-- Glow halo -->
    <circle cx="64" cy="11" r="7" fill="#00ffa3" opacity="0.25"/>
    <!-- Satellite body -->
    <rect x="61" y="8.5" width="6" height="5" rx="1" fill="#e8f4ff"/>
    <!-- Solar panels -->
    <rect x="53" y="10" width="7" height="2" rx="0.5" fill="#00ffa3" opacity="0.9"/>
    <rect x="68" y="10" width="7" height="2" rx="0.5" fill="#00ffa3" opacity="0.9"/>
    <!-- Signal dot -->
    <circle cx="64" cy="11" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Signal beam down to Earth -->
  <line x1="64" y1="16" x2="64" y2="28"
        stroke="#00ffa3" stroke-width="0.8"
        stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Outer ring border -->
  <circle cx="64" cy="64" r="60" fill="none"
          stroke="#00ffa3" stroke-width="1.2" opacity="0.3"/>
  <circle cx="64" cy="64" r="58" fill="none"
          stroke="#ffffff" stroke-width="0.3" opacity="0.15"/>

  <!-- Letter A — centered, subtle -->
  <text x="64" y="70"
        font-family="'Courier New', Courier, monospace"
        font-size="22" font-weight="700"
        text-anchor="middle"
        fill="#00ffa3" opacity="0.22"
        letter-spacing="0">A</text>
</svg>
