name: CI PNT (tests + docs build)

# Лёгкий workflow, специфичный для модулей AURORA PNT и сборки DOCX.
# Запускается на каждом push/PR в ветки feature/* и main.

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pnt-tests:
    name: PNT Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal PNT dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pyyaml pytest

      - name: Run PNT physics + smoke tests
        run: |
          python -m pytest tests/test_constellation_physics.py \
                          tests/test_link_budget.py \
                          tests/test_clock_budget.py \
                          tests/test_relativistic.py \
                          tests/test_modules_smoke.py \
                          -v --tb=short --color=yes

  lint-pnt:
    name: Lint PNT modules (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint critical errors
        run: |
          # Только синтаксические ошибки и undefined names
          ruff check aurora/pnt/ tests/ --select=E9,F63,F7,F82 --statistics

  build-tech-project:
    name: Build technical project DOCX
    runs-on: ubuntu-latest
    needs: pnt-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docx dependencies
        run: |
          pip install python-docx pyyaml

      - name: Build AURORA_PNT_GOST.docx
        run: python convert_gost.py

      - name: Upload DOCX
        uses: actions/upload-artifact@v4
        with:
          name: AURORA_PNT_GOST_docx
          path: AURORA_PNT_GOST.docx
          retention-days: 30
